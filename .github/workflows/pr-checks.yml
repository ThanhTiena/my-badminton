name: PR Quality Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check || echo "::warning::TypeScript errors found"

      - name: Lint
        run: npm run lint || echo "::warning::Linting errors found"

      - name: Run tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e || echo "::warning::E2E tests not configured yet"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual || echo "::warning::Visual regression tests not configured yet"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun || echo "::warning::Lighthouse not configured yet"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  design-review:
    name: Design Fidelity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Court compliance
        run: |
          echo "Checking Court design compliance..."

          # Check for purple color usage (should be zero)
          if grep -r "#7C3AED\|#EC4899\|purple" styles/ components/ pages/ --include="*.css" --include="*.tsx" --exclude-dir=node_modules; then
            echo "::error::Found purple colors in code. Court design uses ink/paper/volt only."
            exit 1
          fi

          # Check for gradient usage in new files
          if grep -r "linear-gradient\|radial-gradient" styles/court.css; then
            echo "::error::Found gradients in court.css. Court design uses flat colors only."
            exit 1
          fi

          echo "✓ Court compliance check passed"

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [build-and-test, e2e-tests, visual-regression, lighthouse, design-review]
    if: always()

    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build and test failed"
            exit 1
          fi
          echo "✓ All quality checks passed"
